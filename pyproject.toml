[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-app"
version = "1.0.0"
description = "A tiny demo app for the Day 4 DevSecOps lab"
requires-python = ">=3.8"
dependencies = ["flask"]

[project.scripts]
demo-app = "demo_app:main"

[tool.setuptools.packages.find]
where = ["src"]
